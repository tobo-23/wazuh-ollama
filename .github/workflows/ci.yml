name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # bouton "Run workflow" (lancement manuel)

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valider le docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Lint YAML
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable, trailing-spaces: disable}}" docker-compose.yml config/

      - name: Analyser le script bash
        run: shellcheck --severity=warning change-password.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuser les fichiers sensibles
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|\.bak-' || true)
          if [ -n "$bad" ]; then
            echo "Fichiers sensibles versionnés :"
            echo "$bad"
            exit 1
          fi

      - name: Détecter les secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Réglage noyau requis par l'indexer (OpenSearch)
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Préparer la stack
        run: |
          cp .env.example .env
          mkdir -p config/wazuh_indexer_ssl_certs
          docker compose run --rm generator
          ls -la config/wazuh_indexer_ssl_certs/

      - name: Démarrer
        run: docker compose up -d wazuh.manager wazuh.indexer wazuh.dashboard

      - name: Attendre l'indexer
        run: |
          # 200 = répond, 401 = répond mais demande un mot de passe : dans les deux cas l'indexer est up
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:9200 || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "Indexer OK (HTTP $code)"; exit 0
            fi
            echo "Essai $i/30 : HTTP $code"
            sleep 10
          done
          docker compose logs --tail=100
          exit 1

      - name: Nettoyer
        if: always()
        run: docker compose down -v